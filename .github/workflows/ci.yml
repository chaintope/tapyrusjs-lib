name: Run Tests

on: [push, pull_request]

jobs:
  actions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x, 24.x ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: 'npm'
      - run: npm ci
      # build, format:ci, lint and the unit tests with the coverage threshold
      - name: Run npm test
        run: npm test
      - name: Check lint (tests)
        run: npm run lint:tests
      # npm test builds first, so src/ and types/ are up to date here
      - name: Check the built output is committed
        run: git diff --exit-code src types
