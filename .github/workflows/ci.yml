name: Run Tests

on: [push, pull_request]

jobs:
  actions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x, 24.x ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: 'npm'
      - run: npm ci
      - name: Check format
        run: npm run format:ci
      - name: Check lint
        run: npm run lint
      - name: Check lint (tests)
        run: npm run lint:tests
      - name: Run unit test
        run: npm run unit
      # npm run unit builds first, so src/ and types/ are up to date here
      - name: Check the built output is committed
        run: git diff --exit-code src types
