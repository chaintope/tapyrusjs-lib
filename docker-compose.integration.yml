# The node the integration tests run against. Everything here is a published
# dev mode test value from tapyrus-core/doc/docker_image.md, so the signer key
# in test/integration/_regtest.ts opens this chain by design.
services:
  tapyrusd:
    image: tapyrus/tapyrusd:v0.7.2
    environment:
      # The genesis block for the aggregate public key
      # 03af80b90d25145da28c583359beb47b21796b2fe1a23c1511e443e7a64dfdb27d.
      GENESIS_BLOCK_WITH_SIG: ''
    volumes:
      - ./test/integration/tapyrus.conf:/etc/tapyrus/tapyrus.conf:ro
    # Bound to the loopback address: the node has no wallet worth protecting,
    # but its RPC takes generatetoaddress and sendtoaddress without any check
    # beyond user:pass, and there is no reason to offer that to the network the
    # development machine happens to sit on.
    ports:
      - '127.0.0.1:12382:12381'
    # No named volume: the chain lives in the container's own filesystem and
    # `docker compose down` throws it away, so every run starts from the same
    # height and the same empty wallet. The entrypoint also ignores
    # GENESIS_BLOCK_WITH_SIG once a genesis file exists, so a kept volume would
    # survive a change to the genesis block above.
